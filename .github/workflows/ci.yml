name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest

