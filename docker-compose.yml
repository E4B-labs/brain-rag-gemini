services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-True}
      TASKTREE_DATABASE_URL: ${TASKTREE_DATABASE_URL:-}
      BRAIN_WORKSPACE_ID: ${BRAIN_WORKSPACE_ID:-demo-workspace}
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-local}
      SQLITE_PATH: /app/data/brain-rag.sqlite3
      RAG_CORPUS_NAME: ${RAG_CORPUS_NAME:-}
      RAG_LOCATION: ${RAG_LOCATION:-us-central1}
    volumes:
      - brain_rag_data:/app/data

volumes:
  brain_rag_data:
